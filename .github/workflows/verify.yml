name: Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Browser files share one shard, but cold Vite/SSR setup in competing Node
      # workers can still starve software graphics on the hosted runner.
      CABANE_TEST_CONCURRENCY: 1
      CABANE_TEST_REPORT: test-results/ci-report.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      # This image includes Chrome's system libraries. Keep Playwright's matching
      # browser, but avoid repeated apt/font downloads and slow Ubuntu mirrors.
      # The suite's browser preflight fails visibly if a library is missing.
      - run: npm run browser:install
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-diagnostics
          path: |
            test-results/ci-report.json
            test-results/browser/
          if-no-files-found: ignore
          retention-days: 7
